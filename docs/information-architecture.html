pages.forEach((p,i)=>{
const tc=document.createElement("div");
tc.className="toc-item";
tc.innerHTML=`<b>${p.num}</b>${p.name}<br><span style="font-family:var(--font-mono);font-size:11px">${p.slug}</span>`;
tc.onclick=()=>{
  document.getElementById(`page-body-${i}`).classList.add("open");
  document.getElementById(`page-${i}`).scrollIntoView({behavior:"smooth"});
};
tocEl.appendChild(tc);

const sectionsHtml=p.sections.map(s=>`
<div class="section">
  <div class="section-title">${s.title}${goal(s.goal)}</div>
  <ul class="section-items">${s.items.map(it=>`<li>${it}</li>`).join("")}</ul>
</div>`).join("");

const card=document.createElement("div");
card.className=`page-card ${p.color}`;
card.id=`page-${i}`;
card.innerHTML=`
<div class="page-header" onclick="togglePage(${i})">
  <div class="page-num">${p.num}</div>
  <div class="page-meta">
    <div class="page-name">${p.name}</div>
    <div class="page-slug">${p.slug}</div>
    <div class="page-purpose">${p.purpose}</div>
  </div>
  <div class="page-chevron" id="chev-${i}">›</div>
</div>
<div class="page-body" id="page-body-${i}">
  <div class="group-label">Sections & content</div>
  ${sectionsHtml}
  <div class="group-label" style="margin-top:16px">Admin / webmaster notes</div>
  <div class="meta-box">${p.admin}</div>
  <div class="group-label">Future expansion</div>
  <div class="meta-box">${p.future}</div>
</div>`;
pagesEl.appendChild(card);
});

function togglePage(i){
const body=document.getElementById(`page-body-${i}`);
const chev=document.getElementById(`chev-${i}`);
const open=body.classList.toggle("open");
chev.style.transform=open?"rotate(90deg)":"";
}
</script>
